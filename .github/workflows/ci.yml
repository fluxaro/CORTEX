name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-and-test:
    name: Backend Lint, Type Check & Pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cortex
          POSTGRES_PASSWORD: cortex_password
          POSTGRES_DB: cortex_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy pytest pytest-asyncio httpx sqlalchemy alembic celery redis pydantic pydantic-settings fastapi uvicorn passlib bcrypt

      - name: Run Ruff Linting
        run: ruff check backend

      - name: Run Black Code Formatting Check
        run: black --check backend

      - name: Run Mypy Type Checks
        run: mypy --config-file backend/pyproject.toml backend/app
        env:
          PYTHONPATH: backend

      - name: Run Pytest Test Suite
        run: pytest backend/tests
        env:
          PYTHONPATH: backend

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend production bundle
        run: |
          cd frontend
          npm run build
